name: Vauchi
options:
  bundleIdPrefix: app.vauchi
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

packages:
  VauchiPlatform:
    url: https://gitlab.com/vauchi/vauchi-platform-swift.git
    version: "0.57.0"
    # The version line must stay immediately below the URL line because
    # scripts/ci-spm-provision.sh extracts it with sed from the next line.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: "1.17.0"

targets:
  Vauchi:
    type: application
    platform: iOS
    sources:
      - path: Vauchi
        excludes:
          # Do NOT exclude **/*.xcassets — Assets.xcassets holds the AppIcon,
          # and excluding it drops the icon from the build (App Store upload
          # errors 90022/90023/90713: missing icon + CFBundleIconName).
          - "Generated"
          - "Libs"
    dependencies:
      - package: VauchiPlatform
        product: VauchiPlatform
      - package: VauchiPlatform
        product: VauchiHardware
      - package: VauchiPlatform
        product: CoreUIModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauchi.ios
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        # Embeds the AppIcon + populates CFBundleIconName (App Store requires
        # both). CI regenerates the .xcodeproj from this file, so it must be
        # declared here, not only in the committed pbxproj.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.12"
        CURRENT_PROJECT_VERSION: "13"
        DEVELOPMENT_TEAM: L2853TNSJ4
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: Vauchi/Vauchi.entitlements
    info:
      path: Vauchi/Info.plist
      properties:
        CFBundleDisplayName: Vauchi
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          # In-person BLE exchange must survive the screen locking / the app
          # briefly backgrounding mid-handshake: without these the OS suspends
          # the GATT peripheral + central and the responder never sends its
          # KeyAck (flaky cross-platform completion).
          - bluetooth-central
          - bluetooth-peripheral
        BGTaskSchedulerPermittedIdentifiers:
          - app.vauchi.sync
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - vauchi
            CFBundleURLName: app.vauchi.ios
        NSBluetoothAlwaysUsageDescription: "Vauchi uses Bluetooth to exchange contact cards with nearby devices."
        NSCameraUsageDescription: "Vauchi uses the camera to scan QR codes for contact exchange."
        NSMicrophoneUsageDescription: "Vauchi uses the microphone for ultrasonic proximity verification during contact exchange."
        NSFaceIDUsageDescription: "Vauchi uses Face ID to unlock the app and authorize sensitive actions like exporting your backup or restoring your identity."
        NFCReaderUsageDescription: "Vauchi uses NFC to exchange contact cards with nearby devices."
        NSLocationWhenInUseUsageDescription: "Vauchi can record where you met a contact during an in-person exchange. This is stored privately on your device and never shared."
        # Export-compliance declaration App Store Connect requires at
        # submission. false = the app's encryption qualifies for export
        # exemption (vauchi-core is GPL / publicly-available crypto), so no
        # ASC compliance docs are required — assessment "exemption applies"
        # in problem 2026-06-11-ios-encryption-export-compliance. Kept here
        # (not just Info.plist) so xcodegen regen doesn't strip it — see
        # 2026-05-24-ios-infoplist-projectyml-drift.
        ITSAppUsesNonExemptEncryption: false
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - F0564155434849

  VauchiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VauchiTests
    dependencies:
      - target: Vauchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauchi.ios.tests
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES

  VauchiSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VauchiSnapshotTests
    dependencies:
      - target: Vauchi
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauchi.ios.snapshot-tests
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES

  VauchiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VauchiUITests
    dependencies:
      - target: Vauchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauchi.ios.uitests
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Vauchi:
    build:
      targets:
        Vauchi: all
        VauchiTests: [test]
        VauchiSnapshotTests: [test]
        VauchiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VauchiTests
        - VauchiSnapshotTests
        - VauchiUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# CI SPM cache-bust 2026-06-08: vauchi-platform-swift v0.51.46 tag was
# re-pointed (old commit 85d5aebb GC.d, now cae47ebc); the per-branch SPM
# runner cache pinned the dead commit. Touching project.yml changes the
# cache key so the runner re-resolves v0.51.46 fresh. See problem record
# 2026-05-08-nell-runner-spm-mirror-corruption.
