name: Vauchi
options:
  bundleIdPrefix: app.vauchi
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  SWIFT_VERSION: "5.9"
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"

packages:
  VauchiPlatform:
    url: https://gitlab.com/vauchi/vauchi-platform-swift.git
    version: "0.51.55"
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing.git
    from: "1.17.0"

targets:
  Vauchi:
    type: application
    platform: iOS
    sources:
      - path: Vauchi
        excludes:
          - "**/*.xcassets"
          - "Generated"
          - "Libs"
    dependencies:
      - package: VauchiPlatform
        product: VauchiPlatform
      - package: VauchiPlatform
        product: CoreUIModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauchi.ios
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.8"
        CURRENT_PROJECT_VERSION: "9"
        DEVELOPMENT_TEAM: L2853TNSJ4
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_ENTITLEMENTS: Vauchi/Vauchi.entitlements
    info:
      path: Vauchi/Info.plist
      properties:
        CFBundleDisplayName: Vauchi
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - app.vauchi.sync
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - vauchi
            CFBundleURLName: app.vauchi.ios
        NSBluetoothAlwaysUsageDescription: "Vauchi uses Bluetooth to exchange contact cards with nearby devices."
        NSCameraUsageDescription: "Vauchi uses the camera to scan QR codes for contact exchange."
        NSMicrophoneUsageDescription: "Vauchi uses the microphone for ultrasonic proximity verification during contact exchange."
        NSFaceIDUsageDescription: "Vauchi uses Face ID to unlock the app and authorize sensitive actions like exporting your backup or restoring your identity."
        NFCReaderUsageDescription: "Vauchi uses NFC to exchange contact cards with nearby devices."
        NSLocationWhenInUseUsageDescription: "Vauchi can record where you met a contact during an in-person exchange. This is stored privately on your device and never shared."
        # Export-compliance declaration App Store Connect requires at
        # submission. Without it, every upload triggers a manual
        # questionnaire. Kept here (not just in Info.plist) so xcodegen
        # regen doesn't strip it — see problem
        # 2026-05-24-ios-infoplist-projectyml-drift.
        ITSAppUsesNonExemptEncryption: true
        com.apple.developer.nfc.readersession.iso7816.select-identifiers:
          - F0564155434849

  VauchiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VauchiTests
    dependencies:
      - target: Vauchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauchi.ios.tests
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES

  VauchiSnapshotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VauchiSnapshotTests
    dependencies:
      - target: Vauchi
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauchi.ios.snapshot-tests
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES

  VauchiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VauchiUITests
    dependencies:
      - target: Vauchi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.vauchi.ios.uitests
        INFOPLIST_GENERATION_MODE: GeneratedFile
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Vauchi:
    build:
      targets:
        Vauchi: all
        VauchiTests: [test]
        VauchiSnapshotTests: [test]
        VauchiUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - VauchiTests
        - VauchiSnapshotTests
        - VauchiUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

# CI SPM cache-bust 2026-06-08: vauchi-platform-swift v0.51.46 tag was
# re-pointed (old commit 85d5aebb GC.d, now cae47ebc); the per-branch SPM
# runner cache pinned the dead commit. Touching project.yml changes the
# cache key so the runner re-resolves v0.51.46 fresh. See problem record
# 2026-05-08-nell-runner-spm-mirror-corruption.
