version = 1
SPDX-PackageName = "vauchi-ios"
SPDX-PackageSupplier = "Mattia Egloff <mattia.egloff@pm.me>"

# License files
[[annotations]]
path = ["LICENSES/**"]
SPDX-FileCopyrightText = "Free Software Foundation"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Lock files
[[annotations]]
path = ["**/Cargo.lock", "**/package-lock.json", "**/yarn.lock", "**/*.lock", "**/Package.resolved"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Git and editor config files
[[annotations]]
path = [".gitignore", "**/.gitignore", ".gitattributes", ".DS_Store", "**/.gitkeep", ".dockerignore", ".swift-version"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# iOS/Xcode specific files
[[annotations]]
path = ["**/*.plist", "**/*.entitlements", "**/*.xcscheme", "**/*.modulemap", "**/*.h", "**/*.a"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# JSON config files and version metadata
[[annotations]]
path = ["**/*.json", "**/.version"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Binary/media files
[[annotations]]
path = ["**/*.png", "**/*.jpg", "**/*.jpeg", "**/*.gif", "**/*.ico", "**/*.svg", "**/*.webp"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Font files
[[annotations]]
path = ["**/*.ttf", "**/*.otf", "**/*.woff", "**/*.woff2", "**/*.eot"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Brand font files (SIL Open Font License 1.1), verbatim from Google Fonts
# via themes/fonts — more specific than the "Font files" rule above.
[[annotations]]
path = ["Vauchi/Resources/Fonts/BricolageGrotesque*.ttf"]
SPDX-FileCopyrightText = "2022 The Bricolage Grotesque Project Authors (https://github.com/ateliertriay/bricolage)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["Vauchi/Resources/Fonts/HankenGrotesk*.ttf"]
SPDX-FileCopyrightText = "2021 The Hanken Grotesk Project Authors (https://github.com/marcologous/hanken-grotesk)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["Vauchi/Resources/Fonts/JetBrainsMono*.ttf"]
SPDX-FileCopyrightText = "2020 The JetBrains Mono Project Authors (https://github.com/JetBrains/JetBrainsMono)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["LICENSES/OFL-1.1.txt"]
SPDX-FileCopyrightText = "SIL International"
SPDX-License-Identifier = "OFL-1.1"

# Build artifacts and cache
[[annotations]]
path = ["**/gradle-wrapper.jar", "**/gradlew", "**/gradlew.bat"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Xcode project files
[[annotations]]
path = ["**/*.pbxproj", "**/*.xcworkspacedata", "**/contents.xcworkspacedata"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Android resource files
[[annotations]]
path = ["**/*.webp"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Snapshot test baselines (generated output)
[[annotations]]
path = ["VauchiSnapshotTests/__Snapshots__/**"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"

# Claude Code project instructions
[[annotations]]
path = ["**/CLAUDE.md"]
SPDX-FileCopyrightText = "2026 Mattia Egloff <mattia.egloff@pm.me>"
SPDX-License-Identifier = "GPL-3.0-or-later"
